#cloud-config
# Provisioning for the general-dev remote Docker engine (EC2, Ubuntu 24.04 arm64).
# Declares the desired end state of the host; passed as user-data at launch by
# the aws cli (see README.md in this folder). The 1TB data volume is formatted
# with a high inode density (-i 8192) because devcontainer agent workloads
# create very large numbers of small files under container filesystems.

package_update: true

packages:
  - zsh
  - git
  - curl
  - ca-certificates
  - gnupg

mounts:
  - ["LABEL=DOCKERDATA", "/var/lib/docker", "ext4", "defaults,noatime,nofail", "0", "2"]

write_files:
  # Docker engine config: containers keep running across dockerd restarts
  # (live-restore), high file-descriptor limits for agent workloads, and
  # capped json logs so runaway container logging cannot fill the disk.
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      {
        "live-restore": true,
        "default-ulimits": {
          "nofile": {
            "Name": "nofile",
            "Hard": 1048576,
            "Soft": 1048576
          }
        },
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "50m",
          "max-file": "3"
        }
      }
  # Kernel limits sized for many concurrent devcontainers running file
  # watchers (VS Code, language servers, agent harnesses).
  - path: /etc/sysctl.d/99-devcontainers.conf
    permissions: "0644"
    content: |
      fs.inotify.max_user_watches=1048576
      fs.inotify.max_user_instances=8192
      fs.aio-max-nr=1048576
      fs.file-max=4194304
      vm.max_map_count=1048576

runcmd:
  # Format and mount the data volume. NVMe device enumeration is NOT
  # deterministic on Nitro instances (the root disk is not always nvme0n1),
  # so the data disk is selected as the single disk carrying no filesystem
  # signatures. Fails fast on zero or multiple candidates.
  - |
    set -e
    if ! blkid -L DOCKERDATA > /dev/null 2>&1; then
      CANDIDATES=""
      for dev in $(lsblk -dn -o NAME,TYPE | awk '$2=="disk"{print $1}'); do
        if [ -z "$(lsblk -n -o FSTYPE "/dev/$dev" | tr -d '[:space:]')" ]; then
          CANDIDATES="$CANDIDATES /dev/$dev"
        fi
      done
      set -- $CANDIDATES
      if [ "$#" -ne 1 ]; then
        echo "FATAL: expected exactly 1 empty data disk, found $#:$CANDIDATES" | tee /dev/console
        exit 1
      fi
      mkfs.ext4 -i 8192 -L DOCKERDATA "$1"
    fi
    mount -a
  # Fail fast if the data volume still did not mount: without this guard
  # Docker would silently install onto the 100GB root volume.
  - |
    if ! mountpoint -q /var/lib/docker; then
      echo "FATAL: /var/lib/docker is not a mountpoint - data volume missing or failed to mount" | tee /dev/console
      exit 1
    fi
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    . /etc/os-release
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker ubuntu
  - sysctl --system
  - chsh -s /usr/bin/zsh ubuntu
  - runuser -l ubuntu -c 'sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
  - systemctl enable --now docker
  - docker info > /var/log/general-dev-docker-info.log 2>&1
  - date -u +"%Y-%m-%dT%H:%M:%SZ" > /etc/general-dev-provisioned
