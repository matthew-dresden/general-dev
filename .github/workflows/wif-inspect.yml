name: wif-inspect
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read the OIDC sub claim
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          echo "$token" | cut -d. -f2 | base64 -d 2>/dev/null | python3 -c "
import json, sys
claims = json.load(sys.stdin)
print('sub:', claims.get('sub'))
print('repository:', claims.get('repository'))
" || true
        env:
          GCP_PROJECT: ${{ vars.GCP_PROJECT }}
