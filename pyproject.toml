[project]
name = "general-dev"
version = "0.1.0"
requires-python = ">=3.11"

# devsecret puts the four record commands (spec Section 4.3; E3-F2-S1-T1) on
# PATH once this project is installed. AC-FUNC-012 requires the console
# script AND the package-discovery setting that makes `devcontainer_config`
# importable once something actually builds or installs this project (a
# container image layer or a host bootstrap step, per Section 4.3's "on
# PATH in the container and on the host"); declaring only the console
# script and no build backend would leave `devsecret` pointing at a module
# no install can ever place on `sys.path`, since `devcontainer_config` lives
# under `.claude/plugins/devcontainer/scripts`, outside every default
# discovery root. `[tool.hatch.build.targets.wheel] packages` below names
# that real directory explicitly instead of relying on flat-layout
# auto-discovery, which would look under the repository root and find
# nothing. `[tool.uv] package = false` (below) still keeps `uv run` and
# `uv sync` from ever invoking this build backend, so `make test` and
# `make validate` stay hermetic and network-free (AC-10.14) even with a
# build backend declared; only a future explicit `uv build` or
# `pip install .` exercises it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
devsecret = "devcontainer_config.cli:main_devsecret"

[tool.hatch.build.targets.wheel]
packages = [".claude/plugins/devcontainer/scripts/devcontainer_config"]

[tool.uv]
# `package = false` keeps `uv run`/`uv sync` from ever attempting to build
# this project via the `[build-system]` table above or fetch a build
# backend, so `make test` and `make validate` stay hermetic (AC-10.14). The
# build backend exists so a real install (a future container image layer or
# host bootstrap step) has package-discovery configuration to build from;
# it is declared but never invoked by anything `make test` or
# `make validate` runs.
package = false

[dependency-groups]
# pyyaml is a test-only dependency: tests/test_ci_workflow.py parses
# .github/workflows/ci.yml with yaml.safe_load instead of grepping it, so a
# job comment-out, a wrong-key nesting, or a step whose command merely
# mentions a target string cannot pass a contract test that never runs it.
# Nothing under .claude/plugins/devcontainer/scripts/devcontainer_config
# imports it (spec Section 3.4 keeps new source on the standard library).
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
    "pyyaml",
]

# pythonpath is required because devcontainer_config lives inside the plugin
# tree at .claude/plugins/devcontainer/scripts, not on a conventional source
# path such as src/ or the repository root (E1-F2-S1-T1 created the package
# there). pytest resolves pythonpath at collection time, so every test that
# does `import devcontainer_config` resolves it without a ModuleNotFoundError.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".claude/plugins/devcontainer/scripts"]

# devcontainer_config exists at this path (E1-F2-S1-T1 created the package).
# coverage resolves `source` at run time and measures its statements against
# this entry, not a typo or a placeholder for source that has yet to land.
[tool.coverage.run]
branch = true
source = [".claude/plugins/devcontainer/scripts/devcontainer_config"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
