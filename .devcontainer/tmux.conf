# tmux configuration for this devcontainer. Installed to ~/.tmux.conf by
# postcreate; tmux reads it when the server starts, so changes here apply to
# containers built afterwards, not to a server already running.

# Every window and pane tmux opens runs default-shell, which is the account's
# login shell, and that is bash here. The terminal profile passes zsh only when
# it *creates* the session, so attaching to an existing one, or opening a window
# with Ctrl+b c, landed you in bash. postcreate rewrites this line with the zsh
# it actually found, so the path below is only the fallback.
set -g default-shell /usr/bin/zsh

# Without this the wheel is not tmux's to handle, so the terminal falls back to
# sending arrow keys. In a shell that walks command history instead of
# scrolling, and prints ^[[A ^[[B when the shell does not consume them. On, the
# wheel scrolls the pane's own scrollback and q leaves.
#
# Trade: text selection with the mouse becomes tmux's, not the terminal's. Hold
# Shift while dragging for the terminal's native selection, which is what
# copies to the system clipboard.
set -g mouse on

# tmux keeps its own scrollback per pane, independent of the terminal's, and
# defaults to 2000 lines. devcontainer.json asks VS Code for 100000, so without
# this the pane would silently discard everything past 2000 and Ctrl+b [ would
# stop well short of what the terminal claims to hold.
set -g history-limit 100000

# ---------------------------------------------------------------------------
# Status bar: the always-visible window switcher
#
# tmux already binds a click on the bar to select-window, and a click inside a
# pane to select-pane, as soon as the mouse is on. What was missing is seeing
# where you are: window-status-style and window-status-current-style both
# default to "default", so the current window was distinguished only by a small
# * flag. Below, it is reversed out of the bar and every name is padded into a
# comfortable click target.
# ---------------------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-interval 5

# The window list can only ever show the session you are attached to, so a
# second session is invisible from the first and the work in it looks lost.
# Every session is therefore listed on the left, the attached one reversed out,
# and the windows of that session follow after the bar.
#
# A comma inside #{?...} separates its true and false branches, so any literal
# comma in this line would have to be written #, to survive.
set -g status-left " #{S:#{?#{==:#{session_name},#{client_session}},#[reverse] #{session_name} #[noreverse], #{session_name} }}#[default]| "
set -g status-left-length 60
set -g status-right " %H:%M "

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-current-style bold,reverse
set -g window-status-separator ""

# Closing a window renumbers the rest, so Ctrl+b <number> always matches the
# number shown in the bar rather than drifting away from it.
set -g renumber-windows on
